version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: artagent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artagent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - artagent-network

  # Backend Service
  backend:
    platform: linux/amd64
    build:
      context: ./
      dockerfile: ./apps/rtagent/backend/Dockerfile
    container_name: artagent-backend
    env_file:
      - ./.env
    environment:
      # Database connection - uses postgres service name as host
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-artagent}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-artagent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Application settings
      PORT: ${BACKEND_PORT:-8010}
    ports:
      - "${BACKEND_PORT:-8010}:${BACKEND_PORT:-8010}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - artagent-network
    restart: unless-stopped

  # Frontend Service
  frontend:
    platform: linux/amd64
    build:
      context: ./apps/rtagent/frontend
      dockerfile: Dockerfile
    container_name: artagent-frontend
    env_file:
      - ./apps/rtagent/frontend/.env
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend
    networks:
      - artagent-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  artagent-network:
    driver: bridge